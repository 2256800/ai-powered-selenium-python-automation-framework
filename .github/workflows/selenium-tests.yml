name: Selenium Automation Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  selenium-tests:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create test user
        run: python scripts/seed_test_user.py

      - name: Start FastAPI application
        shell: pwsh
        run: |
          Start-Process python -ArgumentList "-m uvicorn login_app.main:app --host 127.0.0.1 --port 8000"
          $ready = $false
          for ($i = 0; $i -lt 30; $i++) {
            try {
              Invoke-WebRequest http://127.0.0.1:8000/ -UseBasicParsing | Out-Null
              $ready = $true
              break
            } catch {
              Start-Sleep -Seconds 2
            }
          }
          if (-not $ready) {
            throw "FastAPI application failed to start."
          }

      - name: Run Selenium tests
        run: python -m pytest -v --tb=short